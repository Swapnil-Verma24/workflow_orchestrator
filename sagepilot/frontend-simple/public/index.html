<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SagePilot - Workflow Builder</title>

  <!-- Vis-Network CSS -->
  <link href="https://unpkg.com/vis-network/styles/vis-network.min.css" rel="stylesheet" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Custom Styles -->
  <link rel="stylesheet" href="style.css">
</head>

<body class="bg-gray-100">

  <!-- Header -->
  <header class="bg-white shadow-md">
    <div class="container mx-auto px-6 py-4 flex justify-between items-center">
      <h1 class="text-2xl font-bold text-gray-800">🚀 SagePilot Workflow Builder</h1>
      <div class="flex gap-2">
        <button id="saveAsBtn"
          class="px-3 py-2 bg-indigo-600 text-white rounded hover:bg-indigo-700 text-sm font-medium">
          💾 Save As...
        </button>
        <button id="loadBtn" class="px-3 py-2 bg-cyan-600 text-white rounded hover:bg-cyan-700 text-sm font-medium">
          📂 Load
        </button>
        <button id="runBtn" class="px-3 py-2 bg-green-600 text-white rounded hover:bg-green-700 text-sm font-medium">
          ▶ Run
        </button>
        <button id="deployBtn"
          class="px-3 py-2 bg-purple-600 text-white rounded hover:bg-purple-700 text-sm font-medium">
          🚀 Deploy
        </button>
        <button id="clearBtn" class="px-3 py-2 bg-red-600 text-white rounded hover:bg-red-700 text-sm font-medium">
          🗑 Clear
        </button>
      </div>
    </div>
  </header>

  <!-- Main Layout -->
  <div class="flex h-screen pt-16">

    <!-- Left Sidebar - Node Palette -->
    <div class="w-64 bg-white shadow-lg p-4 overflow-y-auto">
      <h2 class="text-lg font-bold mb-4 text-gray-800">📦 Node Palette</h2>

      <div class="space-y-2">
        <button
          class="add-node-btn w-full p-3 bg-green-100 border-2 border-green-500 rounded-lg text-left hover:shadow-md transition"
          data-type="manual_trigger">
          <div class="font-medium text-green-700">▶ Manual Trigger</div>
          <div class="text-xs text-gray-600">Start workflow manually</div>
        </button>

        <button
          class="add-node-btn w-full p-3 bg-purple-100 border-2 border-purple-500 rounded-lg text-left hover:shadow-md transition"
          data-type="webhook_trigger">
          <div class="font-medium text-purple-700">⚡ Webhook Trigger</div>
          <div class="text-xs text-gray-600">Start via HTTP POST</div>
        </button>

        <button
          class="add-node-btn w-full p-3 bg-yellow-100 border-2 border-yellow-500 rounded-lg text-left hover:shadow-md transition"
          data-type="transform_data">
          <div class="font-medium text-yellow-700">🔄 Transform Data</div>
          <div class="text-xs text-gray-600">Modify payload</div>
        </button>

        <button
          class="add-node-btn w-full p-3 bg-orange-100 border-2 border-orange-500 rounded-lg text-left hover:shadow-md transition"
          data-type="decision_node">
          <div class="font-medium text-orange-700">🔀 Decision</div>
          <div class="text-xs text-gray-600">Conditional branching</div>
        </button>

        <button
          class="add-node-btn w-full p-3 bg-red-100 border-2 border-red-500 rounded-lg text-left hover:shadow-md transition"
          data-type="end">
          <div class="font-medium text-red-700">🏁 End</div>
          <div class="text-xs text-gray-600">Terminal node</div>
        </button>

        <button
          class="add-node-btn w-full p-3 bg-blue-100 border-2 border-blue-500 rounded-lg text-left hover:shadow-md transition"
          data-type="http_request">
          <div class="font-medium text-blue-700">🌐 HTTP Request</div>
          <div class="text-xs text-gray-600">Make outbound API calls</div>
        </button>

        <button
          class="add-node-btn w-full p-3 bg-amber-100 border-2 border-amber-500 rounded-lg text-left hover:shadow-md transition"
          data-type="wait">
          <div class="font-medium text-amber-700">⏳ Wait</div>
          <div class="text-xs text-gray-600">Pause execution</div>
        </button>
      </div>
    </div>

    <!-- Center - Workflow Canvas -->
    <div class="flex-1 relative">
      <div id="network" class="w-full h-full"></div>
    </div>

    <!-- Right Sidebar - Config Panel -->
    <div id="configPanel" class="w-96 bg-white shadow-lg p-6 overflow-y-auto hidden">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-xl font-bold text-gray-800">⚙ Configure Node</h2>
        <button id="closeConfigBtn" class="text-gray-500 hover:text-gray-700 text-2xl">&times;</button>
      </div>

      <div id="nodeInfo" class="mb-4 p-3 bg-gray-100 rounded">
        <div class="text-sm font-medium text-gray-600">Node Type</div>
        <div id="nodeTypeLabel" class="text-lg font-bold text-gray-800"></div>
        <div class="text-xs text-gray-500 mt-1">ID: <span id="nodeIdLabel"></span></div>
      </div>

      <form id="configForm" class="space-y-4">
        <!-- Dynamic form fields will be inserted here -->
      </form>

      <div class="flex gap-2 mt-6">
        <button id="saveConfigBtn" type="button"
          class="flex-1 px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 font-medium">
          💾 Save
        </button>
        <button id="deleteNodeBtn" type="button"
          class="px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 font-medium">
          🗑 Delete
        </button>
      </div>
    </div>

  </div>

  <!-- Save As Modal -->
  <div id="saveAsModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
    <div class="bg-white rounded-lg p-6 max-w-md w-full">
      <h3 class="text-xl font-bold mb-4">💾 Save Workflow As</h3>
      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700 mb-2">Workflow Name</label>
        <input id="workflowNameInput" type="text" class="w-full p-2 border border-gray-300 rounded"
          placeholder="e.g., My Workflow">
      </div>
      <div class="flex gap-2">
        <button id="confirmSaveBtn" class="flex-1 px-4 py-2 bg-indigo-600 text-white rounded hover:bg-indigo-700">
          Save
        </button>
        <button id="cancelSaveBtn" class="px-4 py-2 bg-gray-300 text-gray-700 rounded hover:bg-gray-400">
          Cancel
        </button>
      </div>
    </div>
  </div>

  <!-- Load Workflow Modal -->
  <div id="loadModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
    <div class="bg-white rounded-lg p-6 max-w-2xl w-full max-h-96">
      <h3 class="text-xl font-bold mb-4">📂 Load Workflow</h3>
      <div id="workflowList" class="overflow-auto max-h-64 mb-4">
        <!-- Workflow list will be populated here -->
      </div>
      <button id="closeLoadBtn" class="px-4 py-2 bg-gray-300 text-gray-700 rounded hover:bg-gray-400">
        Close
      </button>
    </div>
  </div>

  <!-- Execution Result Modal -->
  <div id="resultModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
    <div class="bg-white rounded-lg p-6 max-w-2xl max-h-96 overflow-auto">
      <h3 class="text-xl font-bold mb-4">📊 Execution Result</h3>
      <pre id="resultContent" class="bg-gray-100 p-4 rounded text-sm overflow-auto"></pre>
      <button id="closeResultBtn"
        class="mt-4 px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">Close</button>
    </div>
  </div>

  <!-- Vis-Network Library -->
  <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>

  <!-- App Logic -->
  <script src="app.js"></script>
</body>

</html>
